<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox-ролик, вариант 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="roller">

    <div class="scene scene-idle">
        <img class="dancer" src="img/mask3.png" alt="Маск с маракасами">
        <img class="fh-rocket" src="img/mask2.png" alt="Ракета Falcon Heavy">
    </div>

    <div class="scene scene-hover">
        <img class="musk-sad" src="img/mask5.png" alt="Маск">
        <span class="rocket-zone"></span>
        <img class="rocket" src="img/mask4.png" alt="Ракета">
        <p class="caption">Как тебе такое?</p>
    </div>

    <div class="scene scene-click">
        <p class="caption-vertical">Меня не удивишь</p>
        <div class="musk-finger">
            <img class="body" src="img/finger3.png" alt="Маск">
            <img class="finger" src="img/finger2.png" alt="">
        </div>
    </div>

</div>

</body>
</html>
